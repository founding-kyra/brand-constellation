<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Brand Constellation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400&family=Syncopate:wght@700&display=swap">
<style>
  :root { --bg: #EEE8DE; --ink: #3A0F07; --soft: rgba(58, 15, 7, .68); --accent: #D2541F; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1D1A18; --ink: #EEE8DE; --soft: rgba(238, 232, 222, .7); --accent: #E36A3A; color-scheme: dark; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Atkinson Hyperlegible", system-ui, sans-serif; display: grid; place-items: center; text-align: center; padding: 0 24px; }
  h1 { font-family: "Syncopate", "Arial Black", sans-serif; font-weight: 700; font-size: clamp(20px, 4vw, 30px); letter-spacing: .16em; text-transform: uppercase; margin: 18px 0 10px; }
  p { color: var(--soft); font-size: 17px; margin: 0; }
  svg { width: 26px; height: 26px; color: var(--accent); }
</style>
</head>
<body>
  <main>
    <svg viewBox="-10 -10 20 20" aria-hidden="true"><path fill="currentColor" d="M0 -10 Q1.6 -1.6 10 0 Q1.6 1.6 0 10 Q-1.6 1.6 -10 0 Q-1.6 -1.6 0 -10Z"/></svg>
    <h1>Brand Constellation</h1>
    <p>A private client hub by Kyra Aulani.</p>
  </main>
</body>
</html>
